<svg xmlns="http://www.w3.org/2000/svg" width="960" height="24" viewBox="0 0 960 24" role="img" aria-hidden="true" focusable="false">
  <style>
    .track { stroke: #d7dee6; stroke-width: 1; stroke-dasharray: 7 6; animation: flow 3.4s linear infinite; }
    .dot { fill: #9a6b12; animation: travel 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    @keyframes travel { 0% { transform: translateX(-10px); } 100% { transform: translateX(970px); } }
    @media (prefers-color-scheme: dark) { .track { stroke: #2a3a52; } .dot { fill: #f2c572; } }
    @media (prefers-reduced-motion: reduce) { .track, .dot { animation: none; } .dot { opacity: 0; } }
  </style>
  <line class="track" x1="0" y1="12" x2="960" y2="12"/>
  <circle class="dot" cx="0" cy="12" r="3"/>
</svg>
