<svg xmlns="http://www.w3.org/2000/svg" width="620" height="188" viewBox="0 0 620 188" role="img" aria-labelledby="title">
  <title id="title">Password Security Lab</title>
  <style>
    .panel { fill: #121821; stroke: #c9a84c; stroke-opacity: 0.35; }
    .kicker { fill: #9aafc0; }
    .title { fill: #f4efe4; }
    .body { fill: #b7c4d0; }
    .spine { fill: #c9a84c; }
    @media (prefers-color-scheme: light) {
      .panel { fill: #f6f1e6; stroke: #8a6a1a; stroke-opacity: 0.4; }
      .kicker { fill: #6b5c45; }
      .title { fill: #1c1914; }
      .body { fill: #4a453c; }
      .spine { fill: #8a6a1a; }
    }
  </style>
  <rect class="panel" x="1" y="1" width="618" height="186" rx="12" stroke-width="1"/>
  <rect class="spine" x="1" y="28" width="4" height="130"/>
  <text class="kicker" x="28" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.1">CYBERSECURITY  |  COMPLETED</text>
  <text class="title" x="28" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="24">Password Security Lab</text>
  <text class="body" x="28" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Hashing under dictionary attack. Isolated lab, synthetic data only.</text>
  <text class="body" x="28" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Argon2id  61 / 1000     MD5  172 / 1000</text>
  <rect x="28" y="160" width="96" height="6" rx="1" fill="#3d6b56"/>
  <rect x="232" y="160" width="270" height="6" rx="1" fill="#8b4a3a"/>
</svg>
