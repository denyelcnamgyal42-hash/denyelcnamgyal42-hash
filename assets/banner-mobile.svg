<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Denyel Chokey Namgyal — from Bhutan, with curiosity.</title>
<desc id="desc">A mint orbit above mountain contours. Computer science, AI and security.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c23"/><stop offset="1" stop-color="#0b1117"/></linearGradient><clipPath id="frame"><rect x="1" y="1" width="638" height="388" rx="18"/></clipPath></defs>
<style>.orbit{transform-origin:541px 279px;animation:spin 30s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style>
<g clip-path="url(#frame)">
<rect width="640" height="390" fill="url(#bg)"/>
<g fill="none" stroke="#76e5c0"><circle cx="541" cy="279" r="61" opacity=".18"/><g class="orbit"><ellipse cx="541" cy="279" rx="61" ry="22" transform="rotate(-35 541 279)" opacity=".55"/><circle cx="592" cy="245" r="3" fill="#76e5c0"/></g><circle class="pulse" cx="541" cy="279" r="6" fill="#76e5c0"/></g>
<path d="M340 390L431 324L459 344L510 299L572 361L606 337L665 390" fill="#111f26" stroke="#355650"/>
<g font-family="Arial,Helvetica,sans-serif">
<circle class="pulse" cx="34" cy="37" r="4" fill="#76e5c0"/><text x="48" y="42" font-size="14" letter-spacing="2" fill="#9eb5bc">DENYEL / ALWAYS LEARNING</text>
<text x="30" y="116" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#f0f5f4">Denyel Chokey</text>
<text x="30" y="175" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#f0f5f4">Namgyal<tspan fill="#76e5c0">.</tspan></text>
<text x="34" y="222" font-size="21" fill="#b2c4ca">Curious about intelligence.</text>
<text x="34" y="252" font-size="21" fill="#b2c4ca">Serious about security.</text>
<text x="34" y="311" font-size="16" letter-spacing="1" fill="#76e5c0">LEARN. BUILD. REPEAT.</text>
<text x="34" y="358" font-size="15" letter-spacing="1.5" fill="#91a6ae">FROM BHUTAN</text>
</g></g><rect x="1" y="1" width="638" height="388" rx="18" fill="none" stroke="#293b44"/>
</svg>
