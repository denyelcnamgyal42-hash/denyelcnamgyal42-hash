    .body { fill: #b7c4d0; }
    .spine { fill: #c9a84c; }
    .cell { fill: none; stroke: #c9a84c; stroke-opacity: 0.28; }
    .path { fill: none; stroke: #c9a84c; }
    .head { fill: #3d6b56; }
    @media (prefers-color-scheme: light) {
      .panel { fill: #f6f1e6; stroke: #8a6a1a; stroke-opacity: 0.4; }
      .kicker { fill: #6b5c45; }
      .title { fill: #1c1914; }
      .body { fill: #4a453c; }
      .spine { fill: #8a6a1a; }
