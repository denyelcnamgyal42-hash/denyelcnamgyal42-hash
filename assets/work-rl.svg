  </style>
  <rect class="panel" x="1" y="1" width="618" height="186" rx="12" stroke-width="1"/>
  <rect class="spine" x="1" y="28" width="4" height="130"/>
  <text class="kicker" x="28" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.1">MACHINE LEARNING  |  PYTHON</text>
  <text class="title" x="28" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="24">RL Snake</text>
  <text class="body" x="28" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">An agent learning a game I can watch. Reward, failure,</text>
  <text class="body" x="28" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">and what learning looks like on a board this small.</text>
