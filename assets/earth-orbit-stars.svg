<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Denyel Chokey Namgyal</title>
  <desc id="description">Computer Science student from Bhutan. A satellite follows a faint orbital trail above Earth's blue horizon and stylized city lights. An occasional shooting star crosses the sky.</desc>
  <defs>
    <linearGradient id="space" x2="1" y2="1">
      <stop stop-color="#090e17"/>
      <stop offset="1" stop-color="#101f33"/>
    </linearGradient>
    <radialGradient id="ocean" cx=".42" cy="0" r=".85">
      <stop stop-color="#204c70"/>
      <stop offset=".38" stop-color="#122e4b"/>
      <stop offset="1" stop-color="#0b1729"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4d8dc0" stop-opacity=".1"/>
      <stop offset=".48" stop-color="#a3dcff"/>
      <stop offset="1" stop-color="#4f9cef" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9acfff" stop-opacity="0"/>
      <stop offset="1" stop-color="#e4f3ff"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#050b15" stop-opacity="0"/>
      <stop offset="1" stop-color="#050b15" stop-opacity=".6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>
    <clipPath id="earth"><circle cx="1070" cy="620" r="460"/></clipPath>
  </defs>
  <style>
    .satellite { animation: drift 28s ease-in-out infinite; }
    .atmosphere { animation: breathe 12s ease-in-out infinite; }
    .meteor { opacity: 0; animation: shooting-star 26s linear infinite; }
    @keyframes shooting-star { 0%, 76% { opacity: 0; transform: translate(0, 0); } 77% { opacity: .8; } 82% { opacity: 0; transform: translate(250px, 65px); } 100% { opacity: 0; transform: translate(250px, 65px); } }
    @keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(-12deg); } 50% { transform: translate(94px, -16px) rotate(-4deg); } }
    @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .65; } }
    @media (prefers-reduced-motion: reduce) { .satellite, .atmosphere, .meteor { animation: none; } .meteor { display: none; } }
  </style>
