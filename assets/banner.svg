<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Denyel Chokey Namgyal — building with curiosity, from Bhutan.</title>
<desc id="desc">Mint orbital lines rise over a Himalayan-inspired mountain silhouette.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c23"/><stop offset="1" stop-color="#0b1117"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#76e5c0" stop-opacity=".12"/><stop offset="1" stop-color="#76e5c0" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#abc4c8" opacity=".13"/></pattern>
<clipPath id="frame"><rect x="1" y="1" width="1198" height="418" rx="20"/></clipPath>
</defs>
<style>
.orbit { transform-origin: 939px 183px; animation: orbit 36s linear infinite; }
.reverse { animation-direction: reverse; animation-duration: 48s; }
.signal { animation: breathe 4s ease-in-out infinite; }
.cursor { animation: blink 1.6s steps(2, jump-none) infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes blink { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .orbit, .signal, .cursor { animation: none; } }
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="420" fill="url(#bg)"/><rect width="1200" height="420" fill="url(#grid)"/>
<circle cx="939" cy="183" r="265" fill="url(#glow)"/>
<g fill="none" stroke="#76e5c0">
<circle cx="939" cy="183" r="113" opacity=".14"/><circle cx="939" cy="183" r="82" opacity=".2"/><circle cx="939" cy="183" r="49" opacity=".3"/>
<path d="M939 51V315M807 183H1071" opacity=".1"/>
<g class="orbit"><ellipse cx="939" cy="183" rx="113" ry="40" transform="rotate(-35 939 183)" opacity=".6"/><circle cx="1032" cy="119" r="4" fill="#76e5c0" stroke="none"/></g>
<g class="orbit reverse"><ellipse cx="939" cy="183" rx="82" ry="30" transform="rotate(45 939 183)" opacity=".35"/><circle cx="997" cy="241" r="3" fill="#d6f5e9" stroke="none"/></g>
<circle class="signal" cx="939" cy="183" r="16"/><circle cx="939" cy="183" r="5" fill="#b6f5dc" stroke="none"/>
</g>
<path d="M660 356L746 271L784 302L867 220L913 274L963 235L1090 354L1151 294L1230 380V420H660Z" fill="#111f26" stroke="#2b4949" stroke-width="1.2"/>
<path d="M784 302L867 220L850 267L873 253L913 274M963 235L985 280L971 268L964 281" fill="none" stroke="#58857d" stroke-width="1.2"/>
<path d="M634 413L770 336L842 362L936 310L1012 360L1090 329L1210 403V420H634Z" fill="#0c151c" stroke="#203a3d"/>
<g font-family="Arial, Helvetica, sans-serif">
<circle class="signal" cx="57" cy="53" r="4" fill="#76e5c0"/>
<text x="72" y="58" fill="#9eb5bc" font-size="12" letter-spacing="2.8">DENYEL / ALWAYS LEARNING</text>
<text x="52" y="143" fill="#f0f5f4" font-size="56" font-weight="700" letter-spacing="-2">Denyel Chokey</text>
<text x="52" y="206" fill="#f0f5f4" font-size="56" font-weight="700" letter-spacing="-2">Namgyal<tspan fill="#76e5c0">.</tspan></text>
<text x="56" y="252" fill="#b2c4ca" font-size="19">Curious about intelligence. Serious about security.</text>
<text x="56" y="299" fill="#76e5c0" font-size="14" font-family="Consolas, 'Courier New', monospace">&gt; learn. build. understand. repeat.</text>
<path class="cursor" d="M362 302h9" stroke="#76e5c0" stroke-width="2"/>
<path d="M56 340H603" stroke="#293b44"/>
<text x="56" y="376" fill="#91a6ae" font-size="12" letter-spacing="1.8">COMPUTER SCIENCE / AI / CYBERSECURITY</text>
<text x="1139" y="376" fill="#91a6ae" font-size="12" letter-spacing="2" text-anchor="end">FROM BHUTAN</text>
</g></g>
<rect x="1" y="1" width="1198" height="418" rx="20" fill="none" stroke="#293b44"/>
</svg>
