<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Denyel Chokey Namgyal</title>
  <desc id="description">Computer Science student from Bhutan. A ringed planet sits at the edge of a starfield with soft nebula clouds; a small probe orbits it continuously, and an occasional meteor crosses the sky.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070a12"/>
      <stop offset="1" stop-color="#0c1224"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx=".5" cy=".5" r=".5">
      <stop stop-color="#8b6fe0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b6fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx=".5" cy=".5" r=".5">
      <stop stop-color="#4fb3c9" stop-opacity=".5"/>
      <stop offset="1" stop-color="#4fb3c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetBody" cx=".38" cy=".35" r=".75">
      <stop stop-color="#f3d9ab"/>
      <stop offset=".55" stop-color="#dba85f"/>
      <stop offset="1" stop-color="#8a5f2f"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#bcd8ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#dcecff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#bcd8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="meteorTail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9acfff" stop-opacity="0"/>
      <stop offset="1" stop-color="#f2f8ff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>
  <style>
    .tw { animation: tw 5s ease-in-out infinite; }
    .breathe { animation: breathe 11s ease-in-out infinite; }
    .breathe2 { animation: breathe 13s ease-in-out infinite; }
    .meteor { opacity: 0; animation: shoot 22s linear infinite; animation-delay: -14s; }
    @keyframes tw { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .5; } 50% { opacity: .85; } }
    @keyframes shoot { 0%, 80% { opacity: 0; transform: translate(0,0); } 81% { opacity: .9; } 87% { opacity: 0; transform: translate(230px,60px); } 100% { opacity: 0; transform: translate(230px,60px); } }
    @media (prefers-reduced-motion: reduce) {
      .tw, .breathe, .breathe2, .meteor { animation: none; }
      .meteor { display: none; }
      .orbit { display: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <ellipse class="breathe" cx="260" cy="90" rx="230" ry="150" fill="url(#nebulaA)" filter="url(#soft)"/>
    <ellipse class="breathe2" cx="970" cy="260" rx="270" ry="170" fill="url(#nebulaB)" filter="url(#soft)"/>

    <g fill="#e8f0ff">
      <circle cx="90" cy="40" r=".8" opacity=".35"/>
      <circle class="tw" cx="150" cy="80" r="1.1" opacity=".5" style="animation-delay:-1.2s"/>
      <circle cx="230" cy="150" r=".8" opacity=".3"/>
      <circle cx="330" cy="40" r=".9" opacity=".4"/>
      <circle class="tw" cx="420" cy="90" r="1.2" opacity=".5" style="animation-delay:-2.7s"/>
      <circle cx="520" cy="30" r=".7" opacity=".3"/>
      <circle cx="600" cy="120" r=".9" opacity=".4"/>
      <circle class="tw" cx="670" cy="55" r="1.1" opacity=".5" style="animation-delay:-3.9s"/>
      <circle cx="60" cy="200" r=".8" opacity=".3"/>
      <circle cx="140" cy="250" r=".7" opacity=".25"/>
      <circle class="tw" cx="250" cy="230" r="1" opacity=".4" style="animation-delay:-.6s"/>
      <circle cx="740" cy="30" r=".8" opacity=".35"/>
      <circle class="tw" cx="800" cy="150" r="1.2" opacity=".5" style="animation-delay:-4.6s"/>
      <circle cx="900" cy="50" r=".7" opacity=".3"/>
      <circle cx="1180" cy="40" r=".8" opacity=".3"/>
      <circle class="tw" cx="1150" cy="120" r="1.1" opacity=".45" style="animation-delay:-3.1s"/>
      <circle cx="1090" cy="60" r=".7" opacity=".3"/>
    </g>

    <g transform="translate(560 50)">
      <g class="meteor">
        <path d="M-70-18L0 0" fill="none" stroke="url(#meteorTail)" stroke-width="2" stroke-linecap="round"/>
        <circle r="1.8" fill="#f2f8ff"/>
      </g>
    </g>

    <!-- ringed planet, tilted -->
    <g transform="rotate(-14 1040 340)">
      <path d="M780 340A260 72 0 0 1 1300 340" fill="none" stroke="url(#ringGrad)" stroke-width="10"/>
      <circle cx="1040" cy="340" r="150" fill="url(#planetBody)"/>
      <g stroke="#7a4f22" stroke-linecap="round" opacity=".35">
        <path d="M905 300Q1040 325 1175 295" fill="none" stroke-width="6"/>
        <path d="M900 355Q1040 380 1180 350" fill="none" stroke-width="8"/>
        <path d="M915 260Q1040 280 1165 255" fill="none" stroke-width="4"/>
      </g>
      <path d="M780 340A260 72 0 0 0 1300 340" fill="none" stroke="url(#ringGrad)" stroke-width="12"/>

      <g class="orbit">
        <animateMotion dur="13s" repeatCount="indefinite" rotate="auto" path="M780,340 A260,72 0 1,1 1300,340 A260,72 0 1,1 780,340"/>
        <g fill="#224a70" stroke="#9fc4ea" stroke-width="1">
          <rect x="-16" y="-5" width="10" height="10" rx="1.5"/>
          <rect x="6" y="-5" width="10" height="10" rx="1.5"/>
          <rect x="-4" y="-3" width="8" height="6" rx="1" fill="#dce8f2" stroke="none"/>
        </g>
        <circle cx="0" cy="0" r="1.4" fill="#a9dcff"/>
      </g>
    </g>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="56" y="64" fill="#9fb2c8" font-size="16" letter-spacing="3">BHUTAN</text>
      <text x="52" y="137" fill="#f6f9ff" font-size="58" font-weight="700" letter-spacing="-1.5">Denyel Chokey</text>
      <text x="52" y="202" fill="#f6f9ff" font-size="58" font-weight="700" letter-spacing="-1.5">Namgyal<tspan fill="#a78bfa">.</tspan></text>
      <text x="56" y="254" fill="#bcc9de" font-size="22">Computer Science · AI · Security</text>
    </g>
  </g>
</svg>
