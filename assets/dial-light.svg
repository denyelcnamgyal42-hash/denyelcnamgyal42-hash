  <title id="title">Denyel Chokey Namgyal. A souscription dial. The aperture holds 14:42, when this account began. Only the seconds move.</title>
  <desc id="desc">Personal seal for a computer science student in Bhutan. Manufacture Namgyal, calibre Until Then. The rim is enamel; the secret signature is a SHA-256 prefix of his name. One red seconds hand.</desc>
  <defs>
    <style>
      .seconds {
        transform-box: view-box;
        transform-origin: 640px 318px;
        animation: sweep 60s linear infinite;
      }
      @keyframes sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .seconds { animation: none; }
      }
    </style>
  </defs>

