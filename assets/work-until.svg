<svg xmlns="http://www.w3.org/2000/svg" width="620" height="188" viewBox="0 0 620 188" role="img" aria-labelledby="title">
  <title id="title">Until Then</title>
  <style>
    .panel { fill: #121821; stroke: #c9a84c; stroke-opacity: 0.35; }
    .kicker { fill: #9aafc0; }
    .title { fill: #f4efe4; }
    .body { fill: #b7c4d0; }
    .spine { fill: #c9a84c; }
    .seal { fill: none; stroke: #c9a84c; }
    .seal-text { fill: #c9a84c; }
    @media (prefers-color-scheme: light) {
      .panel { fill: #f6f1e6; stroke: #8a6a1a; stroke-opacity: 0.4; }
      .kicker { fill: #6b5c45; }
      .title { fill: #1c1914; }
      .body { fill: #4a453c; }
      .spine { fill: #8a6a1a; }
      .seal { stroke: #8a6a1a; }
      .seal-text { fill: #8a6a1a; }
    }
  </style>
  <rect class="panel" x="1" y="1" width="618" height="186" rx="12" stroke-width="1"/>
  <rect class="spine" x="1" y="28" width="4" height="130"/>
  <text class="kicker" x="28" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.1">SOFTWARE  |  PRODUCT</text>
  <text class="title" x="28" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="24">Until Then</text>
  <text class="body" x="28" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">A time capsule for shared memories. Sealed until a date</text>
  <text class="body" x="28" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">the people who made them chose. Time, consent, secrecy.</text>
  <circle class="seal" cx="524" cy="142" r="22" stroke-width="1.4"/>
  <circle class="seal" cx="524" cy="142" r="16" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text class="seal-text" x="524" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="1.2">SEAL</text>
</svg>
