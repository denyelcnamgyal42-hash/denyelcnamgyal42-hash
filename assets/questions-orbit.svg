<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">Questions I'm exploring</title>
  <desc id="desc">Three points along a low orbital arc, each lighting up in turn: whether retrieval improves an answer, what secures a small app from day one, and whether language tools can help with less data. Decorative — the same questions appear as plain text below.</desc>
  <style>
    .track { stroke: #c9d3dc; stroke-width: 1.2; stroke-dasharray: 1.5 6; fill: none; }
    .idx { fill: #7a8b98; font-size: 12px; letter-spacing: 1px; text-anchor: middle; }
    .label { fill: #24343d; font-size: 14px; text-anchor: middle; }
    .node { fill: #8bbcff; }
    .glow { fill: #8bbcff; opacity: 0; animation: pulse 4.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0; transform: scale(1); } 50% { opacity: .35; transform: scale(2.2); } }
    .p0 { animation-delay: 0s; } .p1 { animation-delay: -1.5s; } .p2 { animation-delay: -3s; }
    @media (prefers-color-scheme: dark) {
      .track { stroke: #26334a; } .idx { fill: #7f93a8; } .label { fill: #dce7e9; } .node, .glow { fill: #a9cbff; }
    }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; opacity: 0; } }
  </style>
  <g font-family="Arial, Helvetica, sans-serif">
    <path class="track" d="M60 80C300 10 600 10 840 80"/>

    <circle class="glow p0" cx="150" cy="68" r="5" style="transform-origin:150px 68px"/>
    <circle class="node" cx="150" cy="68" r="4.5"/>
    <circle class="glow p1" cx="450" cy="28" r="5" style="transform-origin:450px 28px"/>
    <circle class="node" cx="450" cy="28" r="4.5"/>
    <circle class="glow p2" cx="750" cy="68" r="5" style="transform-origin:750px 68px"/>
    <circle class="node" cx="750" cy="68" r="4.5"/>

    <text class="idx" x="150" y="16">01</text>
    <text class="idx" x="450" y="16">02</text>
    <text class="idx" x="750" y="16">03</text>

    <text class="label" x="150" y="114">
      <tspan x="150" dy="0">Does retrieval improve</tspan>
      <tspan x="150" dy="20">the answer?</tspan>
    </text>
    <text class="label" x="450" y="114">
      <tspan x="450" dy="0">What secures a small</tspan>
      <tspan x="450" dy="20">app from day one?</tspan>
    </text>
    <text class="label" x="750" y="114">
      <tspan x="750" dy="0">Can language tools help</tspan>
      <tspan x="750" dy="20">with less data?</tspan>
    </text>
  </g>
</svg>
