<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Denyel Chokey Namgyal</title>
  <desc id="description">Computer Science student from Bhutan. A line-art mountain ridge and a hand-drawn constellation, both traced in slowly flowing dashed light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#0d1626"/>
    </linearGradient>
    <linearGradient id="ridgeFill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8bbcff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8bbcff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>
  <style>
    .flow { stroke-dasharray: 7 6; animation: flow 3.4s linear infinite; }
    .flow-slow { stroke-dasharray: 5 5; animation: flow 5s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    .amb { animation: amb 5s ease-in-out infinite; }
    .node { animation: node 3.2s ease-in-out infinite; }
    @keyframes amb { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
    @keyframes node { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .flow-slow, .amb, .node { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <!-- ambient background stars -->
    <g fill="#d3e6fa">
      <circle cx="120" cy="40" r=".8" opacity=".3"/>
      <circle class="amb" cx="220" cy="70" r="1" opacity=".4" style="animation-delay:-1.1s"/>
      <circle cx="330" cy="34" r=".7" opacity=".3"/>
      <circle cx="60" cy="120" r=".8" opacity=".25"/>
      <circle class="amb" cx="410" cy="90" r="1.1" opacity=".4" style="animation-delay:-2.6s"/>
      <circle cx="500" cy="50" r=".7" opacity=".3"/>
      <circle cx="180" cy="150" r=".8" opacity=".3"/>
      <circle class="amb" cx="560" cy="120" r="1" opacity=".35" style="animation-delay:-3.8s"/>
      <circle cx="640" cy="60" r=".8" opacity=".3"/>
      <circle cx="980" cy="150" r=".8" opacity=".3"/>
      <circle class="amb" cx="1050" cy="40" r="1" opacity=".4" style="animation-delay:-.8s"/>
      <circle cx="1150" cy="150" r=".7" opacity=".3"/>
      <circle cx="1110" cy="185" r=".8" opacity=".3"/>
      <circle class="amb" cx="960" cy="35" r="1.1" opacity=".4" style="animation-delay:-4.4s"/>
    </g>

    <!-- constellation: a small dipper-like asterism -->
    <g fill="none" stroke="#8bbcff" stroke-linecap="round" stroke-width="1.2" opacity=".55">
      <path class="flow" d="M700 132L760 108"/>
      <path class="flow" d="M760 108L818 90"/>
      <path class="flow" d="M818 90L888 75"/>
      <path class="flow" d="M888 75L900 120"/>
      <path class="flow" d="M900 120L826 132"/>
      <path class="flow" d="M826 132L818 90"/>
    </g>
    <g fill="#d3e6fa">
      <circle cx="700" cy="132" r="1.6"/>
      <circle cx="760" cy="108" r="1.6"/>
      <circle cx="888" cy="75" r="1.6"/>
      <circle cx="826" cy="132" r="1.6"/>
    </g>
    <g fill="#f2c572">
      <circle class="node" cx="818" cy="90" r="2.4"/>
      <circle class="node" cx="900" cy="120" r="2.4" style="animation-delay:-1.6s"/>
    </g>

    <!-- mountain ridge -->
    <path d="M0 300L90 250L170 275L260 205L340 255L430 190L520 240Q560 220 600 235L680 180L760 230L850 200L950 250L1040 210L1120 245L1200 220L1200 340L0 340Z" fill="url(#ridgeFill)"/>
    <path class="flow-slow" d="M0 300L90 250L170 275L260 205L340 255L430 190L520 240Q560 220 600 235L680 180L760 230L850 200L950 250L1040 210L1120 245L1200 220" fill="none" stroke="#8bbcff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="56" y="64" fill="#91a7bf" font-size="16" letter-spacing="3">BHUTAN</text>
      <text x="52" y="137" fill="#f0f6fc" font-size="58" font-weight="700" letter-spacing="-1.5">Denyel Chokey</text>
      <text x="52" y="202" fill="#f0f6fc" font-size="58" font-weight="700" letter-spacing="-1.5">Namgyal<tspan fill="#f2c572">.</tspan></text>
      <text x="56" y="254" fill="#b2c1d2" font-size="22">Computer Science · AI · Security</text>
      <path class="flow" d="M56 270H340" fill="none" stroke="#f2c572" stroke-width="1.2" opacity=".6"/>
    </g>
  </g>
</svg>
