<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Denyel Chokey Namgyal</title>
  <desc id="description">Computer Science student from Bhutan. A satellite moves above Earth's curved blue horizon in a quiet star field.</desc>
  <defs>
    <linearGradient id="space" x2="1" y2="1">
      <stop stop-color="#090e17"/>
      <stop offset="1" stop-color="#101f33"/>
    </linearGradient>
    <radialGradient id="ocean" cx=".42" cy="0" r=".85">
      <stop stop-color="#204c70"/>
      <stop offset=".38" stop-color="#122e4b"/>
      <stop offset="1" stop-color="#0b1729"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4d8dc0" stop-opacity=".1"/>
      <stop offset=".48" stop-color="#a3dcff"/>
      <stop offset="1" stop-color="#4f9cef" stop-opacity=".4"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>
    <clipPath id="earth"><circle cx="1070" cy="620" r="460"/></clipPath>
  </defs>
  <style>
    .satellite { animation: drift 28s ease-in-out infinite; }
    .atmosphere { animation: breathe 12s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(-12deg); } 50% { transform: translate(94px, -16px) rotate(-4deg); } }
    @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .65; } }
    @media (prefers-reduced-motion: reduce) { .satellite, .atmosphere { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#space)"/>
    <g fill="#d3e6fa">
      <circle cx="742" cy="48" r="1" opacity=".4"/>
      <circle cx="841" cy="28" r="1.3" opacity=".5"/>
      <circle cx="1008" cy="45" r="1" opacity=".35"/>
      <circle cx="1148" cy="66" r="1.5" opacity=".6"/>
      <circle cx="1081" cy="106" r=".8" opacity=".35"/>
      <circle cx="771" cy="170" r="1" opacity=".3"/>
      <circle cx="692" cy="267" r=".8" opacity=".25"/>
    </g>
    <circle class="atmosphere" cx="1070" cy="620" r="467" fill="none" stroke="#529fea" stroke-width="15" opacity=".5"/>
    <circle cx="1070" cy="620" r="461" fill="url(#ocean)" stroke="url(#rim)" stroke-width="3"/>
    <g clip-path="url(#earth)">
      <path d="M871 225L902 208L928 213L944 207L970 228L960 244L981 257L961 279L940 276L919 294L907 275L883 264Z M1042 302L1073 285L1089 292L1114 279L1140 304L1132 340H1067Z" fill="#477279" opacity=".3"/>
      <g fill="none" stroke="#c0d9e9" stroke-linecap="round">
        <path d="M816 251C864 221 903 223 925 230M947 219C1016 193 1080 204 1129 224" stroke-width="4" opacity=".15"/>
        <path d="M850 288C927 257 1003 271 1045 295M1106 249C1154 255 1198 279 1230 306" stroke-width="7" opacity=".1"/>
        <path d="M793 275C835 251 876 248 900 251M983 242C1030 229 1086 241 1108 251" stroke-width="2" opacity=".18"/>
      </g>
    </g>
    <g transform="translate(877 118)">
      <g class="satellite">
        <g fill="#224a70" stroke="#82b3de" stroke-width="1">
          <path d="M-35-10H-12V10H-35ZM12-10H35V10H12Z"/>
          <path d="M-27-10V10M-19-10V10M20-10V10M28-10V10M-35 0H-12M12 0H35" stroke-width=".6"/>
        </g>
        <path d="M-12 0H12" stroke="#b7c9da" stroke-width="2"/>
        <rect x="-7" y="-12" width="14" height="24" rx="2" fill="#cfdeea"/>
        <rect x="-4" y="-8" width="8" height="7" rx="1" fill="#7994af"/>
        <path d="M0-12V-19M-5-20Q0-16 5-20" fill="none" stroke="#dce8f2" stroke-width="1.2"/>
        <circle cx="0" cy="7" r="1.5" fill="#79c8ff"/>
      </g>
    </g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="56" y="64" fill="#91a7bf" font-size="16" letter-spacing="3">BHUTAN</text>
      <text x="52" y="137" fill="#f0f6fc" font-size="58" font-weight="700" letter-spacing="-1.5">Denyel Chokey</text>
      <text x="52" y="202" fill="#f0f6fc" font-size="58" font-weight="700" letter-spacing="-1.5">Namgyal<tspan fill="#8bbcff">.</tspan></text>
      <text x="56" y="254" fill="#b2c1d2" font-size="22">Computer Science · AI · Security</text>
    </g>
  </g>
</svg>
