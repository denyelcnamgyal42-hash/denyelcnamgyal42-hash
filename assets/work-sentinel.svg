<svg xmlns="http://www.w3.org/2000/svg" width="620" height="188" viewBox="0 0 620 188" role="img" aria-labelledby="title">
  <title id="title">SentinelAI</title>
  <style>
    .panel { fill: #121821; stroke: #c9a84c; stroke-opacity: 0.35; }
    .kicker { fill: #9aafc0; }
    .title { fill: #f4efe4; }
    .body { fill: #b7c4d0; }
    .spine { fill: #c9a84c; }
    .stamp { fill: none; stroke: #c9a84c; stroke-opacity: 0.55; }
    .stamp-text { fill: #c9a84c; }
    @media (prefers-color-scheme: light) {
      .panel { fill: #f6f1e6; stroke: #8a6a1a; stroke-opacity: 0.4; }
      .kicker { fill: #6b5c45; }
      .title { fill: #1c1914; }
      .body { fill: #4a453c; }
      .spine { fill: #8a6a1a; }
      .stamp { stroke: #8a6a1a; }
      .stamp-text { fill: #8a6a1a; }
    }
  </style>
  <rect class="panel" x="1" y="1" width="618" height="186" rx="12" stroke-width="1"/>
  <rect class="spine" x="1" y="28" width="4" height="130"/>
  <text class="kicker" x="28" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.1">AI  x  SECURITY  |  IN PROGRESS</text>
  <text class="title" x="28" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="24">SentinelAI</text>
  <text class="body" x="28" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Authorized web testing with reports a human can stand behind.</text>
  <text class="body" x="28" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Findings, severity, and what to do next. Not a scanner dump.</text>
  <rect class="stamp" x="430" y="132" width="162" height="32" rx="4" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="stamp-text" x="511" y="153" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6">AUTHORIZED SCOPE</text>
</svg>
