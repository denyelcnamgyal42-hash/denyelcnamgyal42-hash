<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Denyel — a quiet place to build</title><desc id="desc">Pastel animated countryside with Bhutan-inspired hills, a distant house, clouds and a person looking toward the horizon.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b9dbe3"/><stop offset=".66" stop-color="#e9e8c8"/><stop offset="1" stop-color="#f7e9be"/></linearGradient>
 <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#8eaf93"/><stop offset="1" stop-color="#537c72"/></linearGradient>
 <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#789d7c"/><stop offset="1" stop-color="#355e54"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <clipPath id="bounds"><rect width="1200" height="420" rx="16"/></clipPath>
 <style>
 .cloud{animation:drift 28s ease-in-out infinite alternate}.cloud.two{animation-duration:38s;animation-direction:alternate-reverse}.grass{transform-box:fill-box;transform-origin:bottom;animation:sway 4s ease-in-out infinite alternate}.firefly{animation:twinkle 4s ease-in-out infinite alternate}.bird{animation:fly 12s ease-in-out infinite alternate}
 @keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(42px)}}@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}@keyframes twinkle{0%,30%{opacity:.15}80%,100%{opacity:.8}}@keyframes fly{from{transform:translate(-8px,4px)}to{transform:translate(22px,-7px)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
<g clip-path="url(#bounds)">
 <path fill="url(#sky)" d="M0 0h1200v420H0z"/>
 <ellipse cx="962" cy="106" rx="100" ry="80" fill="#fff4cf" opacity=".6" filter="url(#blur)"/><circle cx="960" cy="105" r="45" fill="#fff5d8" opacity=".85"/>
 <g class="cloud" fill="#fff9e9" opacity=".78"><ellipse cx="190" cy="89" rx="75" ry="17"/><ellipse cx="225" cy="80" rx="55" ry="22"/><ellipse cx="150" cy="81" rx="40" ry="20"/></g>
 <g class="cloud two" fill="#fff9e8" opacity=".65"><ellipse cx="760" cy="57" rx="74" ry="13"/><ellipse cx="796" cy="49" rx="40" ry="17"/><ellipse cx="720" cy="54" rx="45" ry="18"/></g>
 <path d="M0 261Q116 184 238 230T486 236Q580 175 664 217T848 224Q963 164 1071 207T1200 208V420H0Z" fill="#a9bea2" opacity=".55"/>
 <path d="M0 313Q144 238 310 271T610 253Q748 221 866 265T1200 251V420H0Z" fill="url(#hill)"/>
 <path d="M0 359Q173 294 337 326T637 312Q803 269 965 308T1200 316V420H0Z" fill="#648d78"/>
 <path d="M0 393Q192 332 360 361T691 352Q888 310 1200 370V420H0Z" fill="url(#grass)"/>
 <!-- cottage inspired by rural mountain homes -->
 <g transform="translate(952 257)" opacity=".86"><path d="M0 15l46-33 54 33v46H0Z" fill="#efe4c5"/><path d="M-10 19L46-26l64 45" fill="none" stroke="#6f7563" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="28" width="24" height="33" fill="#6c7565"/><rect x="12" y="25" width="15" height="14" fill="#8ba8a0"/><rect x="75" y="25" width="14" height="14" fill="#8ba8a0"/></g>
 <!-- single traveler, looking at the hills -->
 <g transform="translate(1051 316)"><ellipse cx="0" cy="79" rx="19" ry="5" fill="#274b47" opacity=".35"/><path d="M-10 25l-6 41 12 3 5-30 6 30 12-2-8-43Z" fill="#333f46"/><path d="M-14 21Q-13-1 0-2Q17 1 15 22L9 38H-10Z" fill="#e7aa76"/><path d="M-14 2Q-12-18 0-18Q19-16 14 5Q3-3-14 2Z" fill="#394445"/><path d="M-12 23L-20 49" stroke="#d59a74" stroke-width="7" stroke-linecap="round"/><path d="M13 24L20 47" stroke="#d59a74" stroke-width="7" stroke-linecap="round"/><path d="M-14 18Q0 9 15 18L19 45H-20Z" fill="#5c786f"/><path d="M-7 67l-3 15M13 67l4 15" stroke="#303c42" stroke-width="8" stroke-linecap="round"/></g>
 <!-- grass strokes -->
 <g class="grass" stroke="#c9d2a1" stroke-width="2" opacity=".68" fill="none"><path d="M49 401l-5-19m5 19 9-15M127 378l-4-15m4 15 8-20M316 401l-9-18m9 18 9-15M733 389l-6-21m6 21 10-17M904 400l-8-17m8 17 8-19M1140 389l-5-16m5 16 11-13"/></g>
 <g class="bird" stroke="#637e79" stroke-width="2" fill="none" stroke-linecap="round"><path d="M836 119q8-8 16 0q8-8 16 0M881 133q6-6 12 0q6-6 12 0"/></g>
 <!-- readable text panel -->
 <rect x="42" y="111" width="594" height="209" rx="14" fill="#f7f5e6" opacity=".84"/>
 <text x="76" y="158" font-family="Georgia,serif" font-size="15" letter-spacing="4" fill="#597d76">A LITTLE CORNER OF THE INTERNET</text>
 <text x="72" y="225" font-family="Georgia,serif" font-size="66" fill="#264d4c">Denyel.</text>
 <path d="M77 243H376" stroke="#98b4a4" stroke-width="2"/>
 <text x="77" y="272" font-family="Verdana,sans-serif" font-size="18" fill="#425f5b">AI · software · cybersecurity</text>
 <text x="77" y="298" font-family="Georgia,serif" font-size="16" font-style="italic" fill="#6a8277">Learning, building, and finding my own way.</text>
 <text x="1124" y="389" font-family="Georgia,serif" font-size="12" fill="#ecedd5" text-anchor="end">BHUTAN  ·  2026</text>
</g></svg>
