name: Contribution snake

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/contribution-snake.yml

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#14785f&color_dots=#ebedf0,#c5eadb,#8ed4b9,#48ad8a,#14785f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#76e5c0&color_dots=#161b22,#193c34,#28634f,#419a77,#76e5c0

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
